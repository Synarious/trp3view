<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRP3 Profile Decoder</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pako for Zlib/Deflate Decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #140d08; 
            background-image: radial-gradient(circle at top center, #2e2014, #0a0604);
            color: #e2d5c5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .wow-panel { 
            background: #2a1d12; 
            border: 2px solid #0f0a06; 
            border-radius: 0.35rem; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 10px 15px -3px rgba(0,0,0,0.7); 
        }
        .wow-sidebar { 
            background: #22160d; 
            border-right: 2px solid #0f0a06; 
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.4);
        }
        
        /* TRP3 Specific Formatting classes - Tighter Margins & Warm Borders */
        .trp-about h1 { font-size: 1.5rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; border-bottom: 1px solid #4a3420; padding-bottom: 0.25rem; color: #ffd100;}
        .trp-about h2 { font-size: 1.25rem; font-weight: bold; margin-top: 0.85rem; margin-bottom: 0.25rem; color: #ffd100;}
        .trp-about h3 { font-size: 1.1rem; font-weight: bold; margin-top: 0.75rem; margin-bottom: 0.25rem; color: #d1b075; }
        .trp-about p { margin-top: 0.25rem; margin-bottom: 0.25rem; color: #e2d5c5; }
        .trp-about a { color: #ffd100; text-decoration: underline; }
        .trp-about a:hover { color: #fff5c2; }

        /* Custom Scrollbar - Warm Theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0f0a06; border-left: 1px solid #22160d; }
        ::-webkit-scrollbar-thumb { background: #382618; border-radius: 2px; border: 1px solid #4a3420; }
        ::-webkit-scrollbar-thumb:hover { background: #4a3420; }

        /* TRP3 Button Styling */
        .trp-btn {
            background: linear-gradient(to bottom, #5c3f22, #3b2713);
            border: 1px solid #140d08;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
            color: #ffd100;
        }
        .trp-btn:hover {
            background: linear-gradient(to bottom, #6d4b29, #4a3118);
            color: #fff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 items-center">

    <div class="w-full max-w-7xl flex flex-col gap-6">
        
        <!-- Header & Input Area -->
        <div class="wow-panel p-5">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-2xl font-bold text-[#ffd100] drop-shadow-md"><i class="fa-solid fa-scroll mr-2 text-[#b58540]"></i>TRP3 Decoder</h1>
                <button id="decodeBtn" class="trp-btn font-bold py-2 px-6 rounded transition duration-200">
                    Decode Profile
                </button>
            </div>
            <textarea id="trpInput" rows="3" class="w-full bg-[#120b06] text-[#c7b299] border border-[#382618] rounded p-3 focus:outline-none focus:ring-1 focus:ring-[#ffd100] font-mono text-xs shadow-inner" placeholder="Paste TRP3 Export String Here..."></textarea>
            <p id="errorMsg" class="text-red-500 mt-2 hidden text-sm font-semibold"></p>
        </div>

        <!-- Output Display: Smart Layout Grid -->
        <div id="outputArea" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Sidebar (Stats, Traits, Glances) -->
            <div class="lg:col-span-4 flex flex-col gap-6">
                
                <!-- Character Identity Header & Unified Glances Panel -->
                <div class="wow-panel overflow-hidden">
                    <!-- Horizontal Identity Layout -->
                    <div class="wow-sidebar p-5 flex items-center gap-4 relative border-b border-[#140d08]">
                        <img id="outIcon" src="" class="w-20 h-20 rounded-md border-2 border-[#140d08] shadow-[0_0_10px_rgba(0,0,0,0.8)] object-cover hidden flex-shrink-0" onerror="this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
                        <div class="flex flex-col items-start text-left min-w-0 w-full">
                            <h2 id="outName" class="text-2xl font-extrabold tracking-tight drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] leading-tight mb-1 w-full" style="color: #ffd100;">Name</h2>
                            <h3 id="outTitle" class="text-[11px] font-bold text-[#d1b075] uppercase tracking-widest mb-2.5 truncate w-full drop-shadow-sm">Title</h3>
                            <p id="outSub" class="text-white text-[11px] font-medium bg-[#140d08] inline-block px-3 py-1 rounded border border-[#382618] shadow-inner whitespace-nowrap">Race • Class</p>
                        </div>
                    </div>
                    
                    <div class="p-4">
                        <!-- Basic Attributes -->
                        <h4 class="text-xs font-bold text-[#e6cc80] border-b border-[#382618] pb-1.5 uppercase tracking-wider mb-3 drop-shadow-sm"><i class="fa-solid fa-book mr-2"></i>Basic Information</h4>
                        <div id="outAttributes" class="grid grid-cols-2 gap-2 mb-5">
                            <!-- Populated via JS -->
                        </div>

                        <!-- Traits & Glances -->
                        <h4 class="text-xs font-bold text-[#e6cc80] border-b border-[#382618] pb-1.5 uppercase tracking-wider mb-3 drop-shadow-sm"><i class="fa-solid fa-address-card mr-2"></i>Additional Information</h4>
                        <div id="outTraits" class="flex flex-col gap-2">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>

                <!-- Personality Traits -->
                <div class="wow-panel p-5 hidden" id="personalityContainer">
                    <h4 class="text-xs font-bold text-[#e6cc80] border-b border-[#382618] pb-1.5 uppercase tracking-wider mb-4 drop-shadow-sm"><i class="fa-solid fa-scale-balanced mr-2"></i>Personality Traits</h4>
                    <div id="outPersonality" class="flex flex-col w-full gap-3">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>

            <!-- Main Content (About Text) -->
            <div class="lg:col-span-8 wow-panel flex flex-col" style="min-height: 600px;">
                <!-- About Header Toolbar -->
                <div class="bg-[#1b120b] border-b border-[#140d08] p-4 flex justify-between items-center rounded-t-md shadow-sm">
                    <div class="flex gap-2">
                        <button class="bg-[#2a1d12] border-t border-l border-r border-[#4a3420] text-[#ffd100] px-4 py-1 text-sm font-bold rounded-t shadow-[0_2px_0_#2a1d12] relative z-10">About</button>
                    </div>
                    
                    <!-- View/Edit Controls -->
                    <div class="flex gap-3 items-center">
                        <div id="editorToolbar" class="hidden flex gap-2 items-center bg-[#140d08] px-3 py-1 rounded border border-[#382618]">
                            <label class="text-xs text-[#d1b075]">Color:</label>
                            <input type="color" id="colorPicker" value="#ffd100" class="w-6 h-6 border-0 cursor-pointer bg-transparent">
                            <button id="applyColorBtn" class="text-xs bg-[#382618] hover:bg-[#4a3420] px-2 py-1 rounded text-white transition border border-[#140d08]" title="Wrap selection in color">
                                Apply
                            </button>
                        </div>
                        
                        <button id="toggleEditBtn" class="text-sm trp-btn px-4 py-1.5 rounded font-medium transition flex items-center">
                            <i class="fa-solid fa-pen mr-1.5 text-xs"></i> Edit Text
                        </button>
                    </div>
                </div>

                <!-- Rendered View -->
                <div id="outAbout" class="trp-about text-[#e2d5c5] leading-relaxed p-6 overflow-y-auto">
                    <!-- Populated via JS -->
                </div>

                <!-- Edit View -->
                <textarea id="editAbout" class="hidden w-full h-full min-h-[500px] bg-[#120b06] text-[#c7b299] border-0 p-6 focus:outline-none focus:ring-0 font-mono text-sm resize-none shadow-inner"></textarea>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            let currentProfile = {};
            let isEditing = false;

            // --- Event Listeners Mapping ---
            document.getElementById('decodeBtn').addEventListener('click', decodeProfile);
            document.getElementById('toggleEditBtn').addEventListener('click', toggleEditMode);
            document.getElementById('applyColorBtn').addEventListener('click', insertColorCode);

            // Core Decoding Logic
            function decodeProfile() {
                const input = document.getElementById('trpInput').value;
                const errorMsg = document.getElementById('errorMsg');
                const outputArea = document.getElementById('outputArea');
                errorMsg.classList.add('hidden');

                try {
                    let base64 = "";
                    const lines = input.split('\n');
                    for (let line of lines) {
                        line = line.trim();
                        if (!line || line.includes("TRP3 PROFILE") || line.includes(": ")) continue;
                        base64 += line;
                    }

                    if (!base64 && input.includes("inventory")) base64 = input;
                    else if (!base64) throw new Error("No valid Base64 payload found. Ensure the BEGIN/END tags are intact.");

                    while (base64.length % 4 !== 0) base64 += '=';

                    let decompressed;
                    try {
                        const binaryStr = window.atob(base64);
                        const bytes = new Uint8Array(binaryStr.length);
                        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                        try { decompressed = pako.inflateRaw(bytes); } 
                        catch (e) { decompressed = pako.inflate(bytes); }
                    } catch (err) {
                        decompressed = new Uint8Array(base64.length);
                        for (let i = 0; i < base64.length; i++) decompressed[i] = base64.charCodeAt(i) & 0xFF;
                    }

                    // Extract mixed types (Strings & Numbers) via robust LibSerialize decoder
                    const tokens = extractLibSerializeTokens(decompressed);
                    currentProfile = parseTRP3Data(tokens);
                    
                    if (!currentProfile.about || currentProfile.about.length < 50) {
                        currentProfile.about = extractTRP3AboutText(decompressed);
                    }

                    renderProfile();
                    outputArea.classList.remove('hidden');

                } catch (err) {
                    console.error(err);
                    errorMsg.textContent = "Error decoding profile: " + err.message;
                    errorMsg.classList.remove('hidden');
                    outputArea.classList.add('hidden');
                }
            }

            // --- Robust LibSerialize Decoder ---
            function extractLibSerializeTokens(uint8Array) {
                let tokens = [];
                let i = 0;
                while (i < uint8Array.length) {
                    let byte = uint8Array[i];
                    let len = 0, headerSize = 0, isString = false;

                    if (byte >= 0x40 && byte <= 0x57) { len = byte - 0x40; headerSize = 1; isString = true; } 
                    else if (byte === 0x58 && i + 1 < uint8Array.length) { len = uint8Array[i+1]; headerSize = 2; isString = true; } 
                    else if (byte === 0x59 && i + 2 < uint8Array.length) { len = uint8Array[i+1] | (uint8Array[i+2] << 8); headerSize = 3; isString = true; } 
                    else if (byte === 0x5A && i + 3 < uint8Array.length) { len = uint8Array[i+1] | (uint8Array[i+2] << 8) | (uint8Array[i+3] << 16); headerSize = 4; isString = true; }

                    if (isString && len > 0 && i + headerSize + len <= uint8Array.length) {
                        try {
                            const strBytes = uint8Array.slice(i + headerSize, i + headerSize + len);
                            const text = new TextDecoder('utf-8').decode(strBytes);
                            tokens.push(text);
                        } catch (e) {}
                        i += headerSize + len;
                    } else {
                        tokens.push(byte);
                        i++;
                    }
                }
                return tokens;
            }

            function extractTRP3AboutText(uint8Array) {
                const rawStr = new TextDecoder('utf-8', {fatal: false}).decode(uint8Array);
                const textBlocks = rawStr.split(/[\x00-\x09\x0B-\x0C\x0E-\x1F]+/);
                let bestBlock = "";
                for (let block of textBlocks) {
                    if (block.length > bestBlock.length && block.length > 50) bestBlock = block;
                }
                if (bestBlock) {
                    const firstBrace = bestBlock.indexOf("{");
                    if (firstBrace > 0 && firstBrace <= 5) bestBlock = bestBlock.substring(firstBrace);
                }
                return bestBlock.trim();
            }

            function scanAhead(tokens, startIndex, targetKey, maxLookahead = 15) {
                for(let j = 1; j <= maxLookahead && startIndex + j < tokens.length; j++) {
                    if (tokens[startIndex + j] === targetKey) {
                        return tokens[startIndex + j + 1] !== undefined ? tokens[startIndex + j + 1] : "";
                    }
                }
                return "";
            }

            // Mappings for Default TRP3 Traits
            const TRP3_DEFAULTS = {
                "1": { leftName: "Chaotic", rightName: "Lawful", leftIcon: "achievement_bg_returnxflags_def_wsg", rightIcon: "spell_holy_blessingofstrength" },
                "2": { leftName: "Forgiving", rightName: "Vindictive", leftIcon: "spell_holy_blessedrecovery", rightIcon: "ability_rogue_nervesofsteel" },
                "3": { leftName: "Truthful", rightName: "Deceitful", leftIcon: "inv_misc_orb_03", rightIcon: "inv_misc_mask_02" },
                "4": { leftName: "Gentle", rightName: "Brutal", leftIcon: "inv_misc_herb_01", rightIcon: "ability_warrior_decisivestrike" },
                "5": { leftName: "Cautious", rightName: "Impulsive", leftIcon: "spell_nature_shamanrage", rightIcon: "spell_fire_incinerate" },
                "6": { leftName: "Ascetic", rightName: "Bon vivant", leftIcon: "inv_misc_food_11", rightIcon: "inv_misc_food_08" },
                "7": { leftName: "Valorous", rightName: "Spineless", leftIcon: "spell_holy_heroism", rightIcon: "ability_hunter_pet_turtle" }
            };

            function parseTRP3Data(tokens) {
                let profile = { 
                    firstName: "", lastName: "", fullTitle: "", race: "", role: "", class: "", icon: "",
                    attributes: [], traits: [], personality: [], about: "" 
                };
                
                for (let i = 0; i < tokens.length; i++) {
                    const s = tokens[i];
                    if (typeof s !== 'string') continue;

                    // Grab profile icon if found before attributes
                    if (s === "IC" && typeof tokens[i+1] === "string" && !profile.icon && profile.attributes.length === 0 && profile.traits.length === 0) {
                        profile.icon = tokens[i+1];
                    }
                    
                    if (s === "FN") profile.firstName = tokens[i+1];
                    if (s === "LN") profile.lastName = tokens[i+1];
                    if (s === "PT" || s === "FT") profile.fullTitle = tokens[i+1];
                    if (s === "RA") profile.race = tokens[i+1];
                    if (s === "CL") profile.class = tokens[i+1];
                    if (s === "RO") profile.role = tokens[i+1];
                    if (s === "profileName" && !profile.firstName) profile.firstName = tokens[i+1];
                    
                    // Attributes & Icons
                    if (s === "NA") {
                        let attr = { 
                            name: tokens[i+1], 
                            value: scanAhead(tokens, i, "VA", 8),
                            icon: scanAhead(tokens, i, "IC", 8)
                        };
                        if (attr.name && attr.value) profile.attributes.push(attr);
                    }
                    
                    // Glances & Icons
                    if (s === "TI") {
                        let trait = { 
                            title: tokens[i+1], 
                            text: scanAhead(tokens, i, "TX", 8),
                            icon: scanAhead(tokens, i, "IC", 8)
                        };
                        if (trait.title && !profile.traits.find(t => t.title === trait.title)) profile.traits.push(trait);
                    }

                    // Custom Personality Traits mapped via (lN, rN)
                    if (s === "lN") {
                        let pTrait = {
                            leftName: tokens[i+1],
                            rightName: scanAhead(tokens, i, "rN", 15),
                            leftIcon: scanAhead(tokens, i, "lI", 15),
                            rightIcon: scanAhead(tokens, i, "rI", 15),
                            value: scanAhead(tokens, i, "v", 15)
                        };
                        if (pTrait.leftName && pTrait.rightName && !profile.personality.find(p => p.leftName === pTrait.leftName)) {
                            profile.personality.push(pTrait);
                        }
                    }

                    // Default Personality Traits mapped via standard IDs ("1", "2", etc.)
                    if (TRP3_DEFAULTS[s]) {
                        let val = tokens[i+1];
                        if (typeof val === "number" && val >= 0 && val <= 4) {
                            let pTrait = { ...TRP3_DEFAULTS[s], value: val };
                            if (!profile.personality.find(p => p.leftName === pTrait.leftName)) {
                                profile.personality.push(pTrait);
                            }
                        }
                    }
                    
                    if (s.length > 50 && (s.includes("{h1") || s.includes("{col:"))) {
                        if (s.length > profile.about.length) profile.about = s;
                    }
                }
                
                profile.attributes = profile.attributes.filter((v,i,a) => a.findIndex(t=>(t.name === v.name)) === i);
                return profile;
            }

            function resolveClassColor(className) {
                if(!className) return "#e2e8f0";
                const map = {
                    "death knight": "#C41E3A", "demon hunter": "#A330C9", "druid": "#FF7C0A",
                    "evoker": "#33937F", "hunter": "#ABD473", "mage": "#3FC7EB",
                    "monk": "#00FF98", "paladin": "#F48CBA", "priest": "#FFFFFF",
                    "rogue": "#FFF468", "shaman": "#0070DE", "warlock": "#8788EE", "warrior": "#C79C6E"
                };
                const c = className.toLowerCase();
                for(let k in map) { if(c.includes(k)) return map[k]; }
                return "#e2e8f0"; 
            }

            // Fallback WoW Class Icons
            function getClassIcon(className) {
                if(!className) return 'inv_misc_questionmark';
                const map = {
                    "death knight": "classicon_deathknight", "demon hunter": "classicon_demonhunter", "druid": "classicon_druid",
                    "evoker": "classicon_evoker", "hunter": "classicon_hunter", "mage": "classicon_mage",
                    "monk": "classicon_monk", "paladin": "classicon_paladin", "priest": "classicon_priest",
                    "rogue": "classicon_rogue", "shaman": "classicon_shaman", "warlock": "classicon_warlock", "warrior": "classicon_warrior"
                };
                const c = className.toLowerCase();
                for(let k in map) { if(c.includes(k)) return map[k]; }
                return 'inv_misc_questionmark';
            }

            function getIconUrl(iconPath) {
                if (!iconPath || typeof iconPath !== 'string') return 'https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg';
                let name = iconPath.split('\\').pop().split('/').pop().toLowerCase();
                name = name.replace(/\.(png|blp|jpg|jpeg)$/i, '');
                return `https://wow.zamimg.com/images/wow/icons/large/${name}.jpg`;
            }

            // --- Render & Editor Logic ---

            function formatTRPText(text) {
                if (!text) return "<i class='text-[#b58540]'>No about information provided.</i>";
                
                text = text.replace(/\{img:.*?\}/gi, '').trim(); 
                text = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                
                text = text.replace(/\{h1:c\}([\s\S]*?)\{\/h1\}/gi, '<h1 class="text-center">$1</h1>')
                           .replace(/\{h1\}([\s\S]*?)\{\/h1\}/gi, '<h1>$1</h1>')
                           .replace(/\{h2:c\}([\s\S]*?)\{\/h2\}/gi, '<h2 class="text-center">$1</h2>')
                           .replace(/\{h2\}([\s\S]*?)\{\/h2\}/gi, '<h2>$1</h2>')
                           .replace(/\{h3:c\}([\s\S]*?)\{\/h3\}/gi, '<h3 class="text-center">$1</h3>')
                           .replace(/\{h3\}([\s\S]*?)\{\/h3\}/gi, '<h3>$1</h3>')
                           .replace(/\{p:c\}([\s\S]*?)\{\/p\}/gi, '<p class="text-center">$1</p>')
                           .replace(/\{p\}([\s\S]*?)\{\/p\}/gi, '<p>$1</p>');
                           
                text = text.replace(/\{col:([0-9a-fA-F]{6})\}/gi, '<span style="color: #$1">')
                           .replace(/\{\/col\}/gi, '</span>')
                           .replace(/\{link\*(.*?)\*(.*?)\}/gi, '<a href="$1" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-link text-xs"></i> $2</a>');

                text = text.replace(/\n*(<\/?(?:h1|h2|h3|p)[^>]*>)\n*/gi, '$1');
                text = text.replace(/\n\n/g, '<br><br>').replace(/\n/g, ' ');

                return text;
            }

            function renderProfile() {
                const p = currentProfile;

                if (p.about) {
                    p.about = p.about.replace(/(BBK|Eauras|Einventory|Echaracter)[\s\S]*$/s, '');
                    p.about = p.about
                        .replace(/\r\n/g, '\n').replace(/\r/g, '\n') 
                        .replace(/\n[ \t]+\n/g, '\n\n')             
                        .replace(/\n{3,}/g, '\n\n')                 
                        .replace(/[ \t]{4,}/g, ' ')                 
                        .trim();
                }

                const fullName = [p.firstName, p.lastName].filter(Boolean).join(" ");
                const subTitleInfo = [p.race, (p.role || p.class)].filter(Boolean).join(" • ");
                const cColor = resolveClassColor(p.class || p.role || "evoker"); 
                
                // Character Icon & Name
                const nameEl = document.getElementById('outName');
                nameEl.textContent = fullName || "Unknown Character";
                // Only override name color if it's not the default gray, else use Gold
                if(cColor !== "#e2e8f0") {
                    nameEl.style.color = cColor;
                }

                const iconEl = document.getElementById('outIcon');
                const iconName = p.icon || getClassIcon(p.class || p.role);
                iconEl.src = getIconUrl(iconName);
                iconEl.classList.remove('hidden');

                const titleEl = document.getElementById('outTitle');
                titleEl.textContent = p.fullTitle || "";
                titleEl.style.display = p.fullTitle ? "block" : "none";

                document.getElementById('outSub').textContent = subTitleInfo || "No identity details";

                // Render Attributes & Wowhead Icons
                const attrContainer = document.getElementById('outAttributes');
                attrContainer.innerHTML = "";
                p.attributes.forEach(attr => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-2 bg-[#120b06] p-1.5 rounded border border-[#2b1c0e] overflow-hidden shadow-inner";
                    div.innerHTML = `
                        <img src="${getIconUrl(attr.icon)}" class="w-6 h-6 rounded border border-[#0f0a06] flex-shrink-0" onerror="this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
                        <div class="flex flex-col flex-grow min-w-0">
                            <span class="text-[9px] text-[#ffd100] font-normal tracking-wide truncate">${attr.name}</span>
                            <span class="text-xs text-white font-medium truncate drop-shadow-sm">${attr.value}</span>
                        </div>
                    `;
                    attrContainer.appendChild(div);
                });

                // Render Glances & Wowhead Icons
                const traitsContainer = document.getElementById('outTraits');
                traitsContainer.innerHTML = "";
                p.traits.forEach(trait => {
                    if(!trait.title && !trait.text) return;
                    const div = document.createElement('div');
                    div.className = "p-2.5 rounded flex gap-3 items-start bg-[#160f09] border border-[#2b1c0e] hover:border-[#ffd100] transition-colors shadow-inner";
                    div.innerHTML = `
                        <img src="${getIconUrl(trait.icon)}" class="w-8 h-8 rounded border border-[#0f0a06] shadow flex-shrink-0" onerror="this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
                        <div class="flex flex-col min-w-0">
                            <h5 class="font-bold text-[13px] text-[#ffd100] mb-0.5 truncate">${trait.title}</h5>
                            <p class="text-[11px] text-[#c7b299] leading-snug">${trait.text || ''}</p>
                        </div>
                    `;
                    traitsContainer.appendChild(div);
                });

                // Render Dual-Color Sliders 
                const pContainer = document.getElementById('personalityContainer');
                const pOutput = document.getElementById('outPersonality');
                pOutput.innerHTML = "";
                if (p.personality.length > 0) {
                    pContainer.classList.remove("hidden");
                    p.personality.forEach(pTrait => {
                        
                        let percent = 50;
                        let val = parseFloat(pTrait.value);
                        if (!isNaN(val)) {
                            if (val >= 0 && val <= 4) percent = (val / 4) * 100;
                            else if (val > 4 && val <= 100) percent = val;
                        }

                        const div = document.createElement('div');
                        div.className = "flex items-center w-full gap-2 mb-1";
                        div.innerHTML = `
                            <span class="text-[11px] text-[#ffd100] w-16 text-right font-medium truncate drop-shadow-md" title="${pTrait.leftName}">${pTrait.leftName}</span>
                            <img src="${getIconUrl(pTrait.leftIcon)}" class="w-6 h-6 rounded border border-[#0f0a06] shadow flex-shrink-0" onerror="this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
                            
                            <div class="flex-grow flex h-2.5 rounded-sm overflow-hidden relative border border-[#0f0a06] shadow-inner bg-black">
                                <div class="bg-gradient-to-r from-yellow-700 to-yellow-500 h-full" style="width: ${percent}%"></div>
                                <div class="bg-gradient-to-r from-blue-700 to-blue-500 h-full" style="width: ${100 - percent}%"></div>
                                <div class="absolute top-0 bottom-0 w-[2px] bg-white shadow left-0" style="margin-left: ${percent}%"></div>
                            </div>

                            <img src="${getIconUrl(pTrait.rightIcon)}" class="w-6 h-6 rounded border border-[#0f0a06] shadow flex-shrink-0" onerror="this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
                            <span class="text-[11px] text-[#3fc7eb] w-16 text-left font-medium truncate drop-shadow-md" title="${pTrait.rightName}">${pTrait.rightName}</span>
                        `;
                        pOutput.appendChild(div);
                    });
                } else {
                    pContainer.classList.add("hidden");
                }

                document.getElementById('outAbout').innerHTML = formatTRPText(p.about);
                document.getElementById('editAbout').value = p.about;
            }

            function toggleEditMode() {
                const outAbout = document.getElementById('outAbout');
                const editAbout = document.getElementById('editAbout');
                const toggleBtn = document.getElementById('toggleEditBtn');
                const toolbar = document.getElementById('editorToolbar');

                isEditing = !isEditing;

                if (isEditing) {
                    outAbout.classList.add('hidden');
                    editAbout.classList.remove('hidden');
                    toolbar.classList.remove('hidden');
                    toolbar.classList.add('flex');
                    toggleBtn.innerHTML = '<i class="fa-solid fa-save mr-1.5"></i> Save Text';
                } else {
                    currentProfile.about = editAbout.value;
                    renderProfile(); 
                    
                    editAbout.classList.add('hidden');
                    outAbout.classList.remove('hidden');
                    toolbar.classList.add('hidden');
                    toolbar.classList.remove('flex');
                    toggleBtn.innerHTML = '<i class="fa-solid fa-pen mr-1.5"></i> Edit Text';
                }
            }

            function insertColorCode() {
                const textarea = document.getElementById('editAbout');
                const picker = document.getElementById('colorPicker');
                const colorHex = picker.value.replace('#', '');
                
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = textarea.value.substring(start, end);
                
                const insertText = `{col:${colorHex}}${selectedText}{/col}`;
                
                textarea.value = textarea.value.substring(0, start) + insertText + textarea.value.substring(end);
                
                if (start === end) {
                    textarea.selectionStart = textarea.selectionEnd = start + 13;
                } else {
                    textarea.selectionStart = start;
                    textarea.selectionEnd = start + insertText.length;
                }
                textarea.focus();
            }
        });
    </script>
</body>
</html>
